name: aegis-shield

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-admin-change-me}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-aegis_identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-aegis_identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-aegis-local-identity-change-me}
      LEDGER_DB_NAME: ${LEDGER_DB_NAME:-aegis_ledger}
      LEDGER_DB_USER: ${LEDGER_DB_USER:-aegis_ledger}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-aegis-local-ledger-change-me}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:-aegis_payments}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER:-aegis_payments}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-aegis-local-payments-change-me}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-aegis_audit}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-aegis_audit}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-aegis-local-audit-change-me}
      RESILIENCE_DB_NAME: ${RESILIENCE_DB_NAME:-aegis_resilience}
      RESILIENCE_DB_USER: ${RESILIENCE_DB_USER:-aegis_resilience}
      RESILIENCE_DB_PASSWORD: ${RESILIENCE_DB_PASSWORD:-aegis-local-resilience-change-me}
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - aegis-network
    labels:
      com.aegis-shield.component: local-data
      com.aegis-shield.service: postgres

  redis:
    image: redis:8.6.5-alpine
    container_name: aegis-redis
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aegis-local-redis-change-me}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - aegis-redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - aegis-network
    labels:
      com.aegis-shield.component: local-messaging
      com.aegis-shield.service: redis

networks:
  aegis-network:
    name: aegis-network
    driver: bridge

volumes:
  aegis-postgres-data:
    name: aegis-postgres-data
  aegis-redis-data:
    name: aegis-redis-data
