name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-only-admin-password
      IDENTITY_DB_PASSWORD: ci-only-identity-password
      LEDGER_DB_PASSWORD: ci-only-ledger-password
      PAYMENTS_DB_PASSWORD: ci-only-payments-password
      AUDIT_DB_PASSWORD: ci-only-audit-password
      REDIS_PASSWORD: ci-only-redis-password
      IDENTITY_DATABASE_URL: postgresql://aegis_identity:ci-only-identity-password@127.0.0.1:5432/aegis_identity?schema=app
      LEDGER_DATABASE_URL: postgresql://aegis_ledger:ci-only-ledger-password@127.0.0.1:5432/aegis_ledger?schema=app
      PAYMENTS_DATABASE_URL: postgresql://aegis_payments:ci-only-payments-password@127.0.0.1:5432/aegis_payments?schema=app
      RISK_DATABASE_URL: postgresql://aegis_audit:ci-only-audit-password@127.0.0.1:5432/aegis_audit?schema=app
      REDIS_URL: redis://:ci-only-redis-password@127.0.0.1:6379/0
      IDENTITY_INTERNAL_TOKEN: ci-only-identity-internal-token
      LEDGER_INTERNAL_TOKEN: ci-only-ledger-internal-token
      PAYMENTS_INTERNAL_TOKEN: ci-only-payments-internal-token
      RISK_INTERNAL_TOKEN: ci-only-risk-internal-token
      RISK_GATEWAY_SOURCE_TOKEN: ci-only-risk-gateway-source-token
      RISK_IDENTITY_SOURCE_TOKEN: ci-only-risk-identity-source-token
      RISK_PAYMENTS_SOURCE_TOKEN: ci-only-risk-payments-source-token
      RISK_LEDGER_SOURCE_TOKEN: ci-only-risk-ledger-source-token
      RISK_INFRASTRUCTURE_SOURCE_TOKEN: ci-only-risk-infrastructure-source-token
      RISK_CHANNEL_SOURCE_TOKEN: ci-only-risk-channel-source-token
      RISK_REDIS_PREFIX: 'aegis:risk:test:ci:'
      RISK_OPERATOR_BOOTSTRAP_TOKEN: ci-only-risk-operator-bootstrap-token
      RISK_SERVICE_PORT: 4105
      RISK_SERVICE_URL: http://127.0.0.1:4105
      PAYMENTS_SERVICE_PORT: 4104
      PAYMENTS_SERVICE_URL: http://127.0.0.1:4104
      PAYMENTS_MIN_TRANSFER_MINOR: 100
      PAYMENTS_MAX_TRANSFER_MINOR: 5000000
      PAYMENTS_DAILY_OUTGOING_LIMIT_MINOR: 10000000
      LEDGER_SERVICE_PORT: 4102
      LEDGER_SERVICE_URL: http://127.0.0.1:4102
      LEDGER_DEFAULT_CURRENCY: LKR
      IDENTITY_REDIS_PREFIX: 'aegis:identity:test:ci:'
      DEMO_AUTH_ENABLED: true
      FIELD_ENCRYPTION_KEY: CI_ONLY_NOT_PRODUCTION_KEY
      # Inclusive payment channels
      PAYMENTS_QR_SIGNING_KEY: ci-only-not-production-qr-signing-key
      PAYMENTS_QR_DYNAMIC_TTL_SECONDS: 300
      PAYMENTS_QR_STATIC_TTL_HOURS: 8760
      USSD_PROVIDER_SECRET: ci-only-not-production-ussd-provider-secret
      PAYMENTS_REDIS_PREFIX: 'aegis:payments:test:ci:'
      # SABCL. SABCL_MODE is deliberately NOT set here. Setting it job-wide
      # would make every service load a SABCL environment, and with no key
      # material configured a strict load fails at startup — which would break
      # the existing Identity, Ledger, Payments, Gateway and Playwright suites
      # that need those services running on their direct paths.
      #
      # Strict mode is exercised instead by suites that build their own keyring
      # from deterministic fixtures: `sabcl:test:e2e` runs a full encrypted
      # journey over real sockets with mode 'strict', and the SABCL package
      # suite covers strict startup validation, placeholder refusal and fixture
      # refusal.
      SABCL_ROUTER_PORT: 4103
      SABCL_ROUTER_URL: http://127.0.0.1:4103
      SABCL_REDIS_PREFIX: 'aegis:sabcl:test:ci:'
      # Operational resilience and disaster recovery.
      #
      # Every value here is a throwaway CI credential. DR_BACKUP_ENCRYPTION_KEY
      # is the base64 of the ASCII string "ci-only-not-production-dr-key-32" —
      # a valid 32-byte key so the real AES-256-GCM path is exercised, and
      # obviously not a secret so nothing is protected by keeping it out of the
      # log. A real key is never committed and never printed.
      RESILIENCE_DB_PASSWORD: ci-only-resilience-password
      RESILIENCE_DATABASE_URL: postgresql://aegis_resilience:ci-only-resilience-password@127.0.0.1:5432/aegis_resilience?schema=app
      RESILIENCE_SERVICE_PORT: 4106
      RESILIENCE_SERVICE_URL: http://127.0.0.1:4106
      RESILIENCE_INTERNAL_TOKEN: ci-only-resilience-internal-token
      RESILIENCE_GATEWAY_SOURCE_TOKEN: ci-only-resilience-gateway-source-token
      RESILIENCE_TOOLING_SOURCE_TOKEN: ci-only-resilience-tooling-source-token
      DR_BACKUP_ENCRYPTION_KEY: Y2ktb25seS1ub3QtcHJvZHVjdGlvbi1kci1rZXktMzI=
      DR_BACKUP_DIR: /tmp/aegis-dr-backups
      # The administrative connection used only to create and drop the
      # disposable verification databases an isolated restore needs.
      DATABASE_URL: postgresql://aegis_admin:ci-only-admin-password@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate infrastructure configuration
        run: pnpm infra:validate
      - name: Start PostgreSQL and Redis
        run: pnpm infra:up
      - name: Check infrastructure health
        run: pnpm infra:check
      # The DR tooling shells out to pg_dump, pg_restore and psql. Those must be
      # at least the server's major version, and the runner image ships an older
      # client than the PostgreSQL 17 container the stack uses, so the matching
      # client is installed explicitly. The version is printed so a mismatch
      # fails here with an obvious message rather than inside a drill.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version
          pg_restore --version
      - name: Generate Identity, Ledger, Payments, Risk and Resilience Prisma Clients
        run: pnpm db:generate
      - name: Apply committed Identity migrations
        run: pnpm db:deploy:identity
      - name: Apply committed Ledger migrations
        run: pnpm db:deploy:ledger
      - name: Apply committed Payments migrations
        run: pnpm db:deploy:payments
      - name: Apply committed Risk migrations
        run: pnpm db:deploy:risk
      - name: Apply committed Resilience migrations
        run: pnpm db:deploy:resilience
      - name: Test infrastructure, environment, demo, reconcile and evidence tooling
        run: node --test "infra/scripts/*.test.mjs"
      # The command surface and the documentation must agree. This fails if a
      # documented pnpm command does not exist, if a release document is
      # missing, or if a markdown link points at a file that is not there.
      - name: Validate documented commands and release documents
        run: node --test infra/scripts/docs.test.mjs
      - name: Test shared contracts
        run: pnpm --filter @aegis/contracts test
      # The SABCL package is built by its own test script, and the gateway and
      # router suites import its dist output, so it runs before them.
      - name: Test SABCL protocol, crypto, padding, rotation and route tokens
        run: pnpm sabcl:test
      - name: Test SABCL metadata leakage against seeded sensitive values
        run: pnpm sabcl:test:leakage
      - name: Test SABCL blind router routing, replay and rate limits
        run: pnpm --filter @aegis/sabcl-router test
      - name: Test Identity service
        run: pnpm --filter @aegis/identity-service test
      - name: Test Identity transfer step-up
        run: pnpm --filter @aegis/identity-service test -- --runTestsByPath src/auth/step-up/transfer-step-up.service.spec.ts
      - name: Test Ledger transfer units including transaction history
        run: pnpm ledger:test
      - name: Test Payments units
        run: pnpm payments:test
      - name: Test Payments application startup and channel configuration
        run: pnpm payments:test:startup
      - name: Test QR signing, tampering, expiry and replay
        run: pnpm channels:test:qr
      - name: Test USSD session state, expiry and webhook security
        run: pnpm channels:test:ussd
      - name: Test agent cash authorization, limits and idempotency
        run: pnpm channels:test:agent
      - name: Test deterministic Risk rules, controls and retention units
        run: pnpm risk:test
      # Covers startup configuration, controlled dependency-failure policy, and
      # the backup manifest refusals: path traversal, symlink escape, duplicate
      # service, unsupported version, wrong key and tampered ciphertext.
      - name: Test Resilience units, failure policy and backup tooling refusals
        run: pnpm resilience:test
      - name: Test Risk PostgreSQL, Redis, ingestion and lifecycle integration
        run: pnpm risk:test:integration
      - name: Test Resilience PostgreSQL append-only drill evidence
        run: pnpm resilience:test:integration
      - name: Test Ledger PostgreSQL transfer integration and concurrency
        run: pnpm ledger:test:integration
      - name: Test Payments PostgreSQL transfer processing
        run: pnpm payments:test:integration
      - name: Test SABCL router with real Redis replay state
        run: pnpm sabcl:test:integration
      - name: Test strict-mode encrypted end-to-end journey through the router
        run: pnpm sabcl:test:e2e
      - name: Test API Gateway
        run: pnpm --filter @aegis/api-gateway test
      - name: Test authentication end to end
        run: pnpm auth:test:e2e
      - name: Test authenticated account and transaction routes end to end
        run: pnpm transactions:test:e2e
      - name: Test real Gateway Identity Payments Ledger transfers end to end
        run: pnpm payments:test:e2e
      - name: Test web transfer components including polling and idempotency
        run: pnpm web:test
      - name: Install Playwright Chromium
        run: pnpm --filter @aegis/web exec playwright install --with-deps chromium
      - name: Test real transfer Playwright journey and browser flows
        run: pnpm web:test:e2e
      - name: Test transfer accessibility including EN SI TA and mobile states
        run: pnpm web:test:a11y
      # Evidence capture is exercised for its sanitization: every captured page
      # is scanned for one-time codes, PINs, cookies, tokens, connection strings
      # and full account references, and the run fails if any is rendered. The
      # images themselves are never uploaded.
      - name: Capture and sanitize demonstration evidence
        run: pnpm --filter @aegis/web test:evidence
      # The browser harness stops infrastructure as part of its own cleanup, so
      # reconciliation restarts it. Named volumes persist, so the ledger written
      # by the earlier steps is still there to be checked.
      - name: Restart infrastructure for reconciliation
        run: pnpm infra:up && pnpm infra:check
      - name: Reconcile Ledger and Payments
        run: pnpm --filter @aegis/ledger-service build && pnpm --filter @aegis/payments-service build && pnpm ledger:reconcile && pnpm payments:reconcile
      # Ledger and Payments reconcile straight against their databases, but the
      # Risk reconciliation is an authenticated call to the running service —
      # it recomputes control and incident state behind its own internal-token
      # boundary rather than reaching into the schema. The browser harness
      # stopped the application services, so Risk is started again just for this
      # check and shut down immediately afterwards.
      - name: Reconcile Risk links and controls
        run: |
          pnpm --filter @aegis/risk-service build
          # Started from its own directory, the way main.ts expects when it
          # resolves the repository .env relative to the service.
          ( cd services/risk && exec node dist/main.js ) &
          risk_pid=$!
          cleanup() {
            kill "$risk_pid" 2>/dev/null || true
            wait "$risk_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4105/health/live >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$risk_pid" 2>/dev/null; then
              echo "Risk exited during startup"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Risk did not become live within 60s"
              exit 1
            fi
            sleep 1
          done
          # `set -e` is on, so a failing reconcile would abort before any
          # cleanup line; the trap above handles shutdown either way.
          pnpm risk:reconcile
      # Backup and restore are operator command-line tooling, never an HTTP
      # endpoint, so they are invoked here the same way an operator would.
      #
      # The set is named explicitly on every command. A bare verify or restore
      # is refused by the tooling, which is asserted below: guessing which set
      # to examine is how a drill records evidence about bytes it never read.
      - name: Create an encrypted backup set and verify it by explicit identifier
        run: |
          # Redirected rather than piped: the default Actions shell is `bash -e`
          # without pipefail, so `| tee` would mask a failing backup behind
          # tee's exit status.
          pnpm dr:backup > backup-summary.json
          cat backup-summary.json
          set_id=$(node -e "
            const fs = require('node:fs');
            const lines = fs
              .readFileSync('backup-summary.json', 'utf8')
              .split(String.fromCharCode(10))
              .map((line) => line.trim())
              .filter(Boolean)
              .reverse();
            for (const line of lines) {
              try {
                const parsed = JSON.parse(line);
                if (parsed && parsed.status === 'PASS' && parsed.backupSetId) {
                  process.stdout.write(parsed.backupSetId);
                  process.exit(0);
                }
              } catch {}
            }
            process.exit(1);
          ")
          rm -f backup-summary.json
          echo "Selected backup set: $set_id"
          echo "AEGIS_BACKUP_SET_ID=$set_id" >> "$GITHUB_ENV"
          pnpm dr:backup:verify -- --set "$set_id"
      - name: Refuse a bare, ambiguous or unknown backup selection
        run: |
          # A bare command must fail rather than pick a set.
          if pnpm dr:backup:verify; then
            echo "A bare verify succeeded; it must require --set or --latest."
            exit 1
          fi
          # A set that does not exist must be reported, never substituted.
          if pnpm dr:backup:verify -- --set backup:1970-01-01:deadbeef; then
            echo "An unknown backup set was accepted."
            exit 1
          fi
          # An identifier shaped like a path must be refused outright.
          if pnpm dr:backup:verify -- --set ../../etc/passwd; then
            echo "A path was accepted as a backup set identifier."
            exit 1
          fi
          # --latest remains available when the operator asks for it.
          pnpm dr:backup:verify -- --latest
      - name: Refuse tampered, wrong-key, incomplete and unsafe backup sets
        run: pnpm dr:backup:verify:negative -- --set "$AEGIS_BACKUP_SET_ID"
      # The restore target is always a freshly created disposable database with
      # a generated name; the tooling refuses any target that matches a live
      # service database, and drops what it created before it exits.
      - name: Verify an isolated restore into disposable databases
        run: pnpm dr:restore:verify -- --set "$AEGIS_BACKUP_SET_ID"
      - name: Run the deterministic disaster-recovery drill
        run: |
          pnpm --filter @aegis/resilience-service build
          pnpm --filter @aegis/risk-service build
          ( cd services/risk && exec node dist/main.js ) &
          risk_pid=$!
          ( cd services/resilience && exec node dist/main.js ) &
          resilience_pid=$!
          cleanup() {
            kill "$resilience_pid" 2>/dev/null || true
            kill "$risk_pid" 2>/dev/null || true
            wait "$resilience_pid" 2>/dev/null || true
            wait "$risk_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          wait_for_live() {
            name=$1
            url=$2
            pid=$3
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$name exited during startup"
                exit 1
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$name did not become live within 60s"
                exit 1
              fi
              sleep 1
            done
          }
          wait_for_live Risk http://127.0.0.1:4105/health/live "$risk_pid"
          wait_for_live Resilience http://127.0.0.1:4106/health/live "$resilience_pid"
          # The drill takes a backup, verifies it, restores into disposable
          # databases, runs the Ledger, Payments, Risk and Resilience
          # reconciliations, records the measured prototype recovery-point age
          # and recovery duration, then cleans up. It fails loudly on any of
          # those steps rather than recording a drill that proved nothing.
          pnpm dr:drill
      # The aggregate command must agree with the four individual runs above.
      # It is run with the same services still up, from the drill step's trap.
      - name: Aggregate reconciliation across Ledger, Payments, Risk and Resilience
        run: |
          pnpm --filter @aegis/risk-service build
          pnpm --filter @aegis/resilience-service build
          ( cd services/risk && exec node dist/main.js ) &
          risk_pid=$!
          ( cd services/resilience && exec node dist/main.js ) &
          resilience_pid=$!
          cleanup() {
            kill "$resilience_pid" 2>/dev/null || true
            kill "$risk_pid" 2>/dev/null || true
            wait "$resilience_pid" 2>/dev/null || true
            wait "$risk_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for url in http://127.0.0.1:4105/health/live http://127.0.0.1:4106/health/live; do
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then break; fi
              if [ "$attempt" -eq 60 ]; then
                echo "$url did not become live within 60s"
                exit 1
              fi
              sleep 1
            done
          done
          pnpm reconcile:all
      # A backup set is customer data under a key, and a decrypted dump is
      # customer data in the clear. Neither may survive the job or reach an
      # artifact, so the working directory is removed and its absence asserted.
      - name: Remove backup working directory and assert no plaintext remains
        if: always()
        run: |
          if [ -d "$DR_BACKUP_DIR" ]; then
            find "$DR_BACKUP_DIR" -type f -name '*.dump' -print -quit | grep -q . \
              && { echo "A decrypted dump survived the drill."; exit 1; }
            rm -rf "$DR_BACKUP_DIR"
          fi
          # /tmp is also where the tooling stages work; nothing may be left.
          leftovers=$(find /tmp -maxdepth 1 -name 'aegis-dr-*' -print 2>/dev/null || true)
          if [ -n "$leftovers" ]; then
            echo "Disaster-recovery working directories were left behind:"
            echo "$leftovers"
            rm -rf /tmp/aegis-dr-*
            exit 1
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/.playwright-report/results.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop application services and infrastructure
        if: always()
        continue-on-error: true
        run: pnpm infra:down

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Identity, Ledger, Payments, Risk and Resilience Prisma Clients
        run: pnpm db:generate
      - name: Build
        run: pnpm build
